schema_version: 1.0.0
curriculum_version: 0.1.0
updated: '2026-10-19'
status: draft
description: Architecture manifest for the Cybersecurity Master Academy. Planning artifact; modules are
  not yet authored or validated.
source_ledger: REFERENCES.md
level_definitions:
- id: L0
  name: Orientation and labcraft
  exit_criterion: Operate safely and legally; write evidence-grade reports; reason about threats.
- id: L1
  name: Systems foundations
  exit_criterion: 'Explain and measure the systems security depends on: hardware, OS, networks, code,
    cryptography, identity, data, and supply chain.'
- id: L2
  name: Core security practice
  exit_criterion: Build, assess, and defend a small system end to end; produce detection and response
    evidence.
- id: L3
  name: Advanced specialization
  exit_criterion: Perform deep technical work in at least one of binary, cloud, identity, detection, forensics,
    or AI security.
- id: L4
  name: Expert practice and leadership
  exit_criterion: Design programs and architectures; lead incidents and reviews; validate controls; teach
    others.
- id: L5
  name: Research and contribution
  exit_criterion: Formulate and execute original, ethical, reproducible research; defend it publicly.
