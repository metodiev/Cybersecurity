name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation toolchain
        run: python -m pip install -r requirements-docs.txt
      - name: Validate manifest
        run: python scripts/validate_manifest.py
      - name: Check local links and nav
        run: python scripts/check_links.py
      - name: Lint Markdown
        run: >-
          pymarkdown --config .pymarkdown.json --strict-config scan
          $(find . -name '*.md' -not -path './.venv/*' -not -path './site/*' -not -type l | sort)
      - name: Verify lab source checksums
        run: |
          (cd labs/sys-01-memory-and-binaries && sha256sum -c SHA256SUMS)
          (cd labs/sys-02-syscalls-and-isolation && sha256sum -c SHA256SUMS)
      - name: Check lab script syntax
        run: |
          python -m py_compile             labs/sys-01-memory-and-binaries/scripts/measure_aslr.py             labs/sys-01-memory-and-binaries/scripts/verify_evidence.py             labs/sys-02-syscalls-and-isolation/scripts/verify_evidence.py
          bash -n labs/sys-02-syscalls-and-isolation/scripts/collect_evidence.sh
      - name: Build site
        run: mkdocs build --strict
